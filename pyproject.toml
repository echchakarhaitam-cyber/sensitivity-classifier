[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sensclf"
version = "0.1.0"
description = "Document-level sensitive-content classification with calibration, abstention and conformal guarantees."
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "Haitam Echchakar"}]
# Our own public library, pinned to an exact commit (498adcc) so that its Document/Span model,
# dataset loaders and split hashing cannot change under us. pyarrow comes with its [data] extra.
dependencies = [
    "privgate[data] @ git+https://github.com/echchakarhaitam-cyber/llm-privacy-gateway@498adccdf1cb5c4b3340a20293a88104fa678fcc",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]
# Exact pins: the versions installed in llm-privacy-gateway's environment.
# psutil: peak memory of training runs (same pin as privgate).
ml = ["scikit-learn==1.7.2", "numpy==2.2.6", "scipy==1.15.3", "psutil==7.2.2"]
plots = ["matplotlib==3.10.9"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Integration tests are opt-in: `pytest -m data`, `pytest -m slow`.
addopts = "-m 'not data and not slow'"
markers = [
    "data: integration tests that need the real raw files (SENSCLF_RAW_DIR) or data/processed/",
    "slow: tests that take minutes",
]

[tool.ruff]
line-length = 100
